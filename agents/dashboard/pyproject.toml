[project]
name = "agent-dashboard"
version = "0.1.0"
description = "Status, history and usage of the Claude Code agent sessions in code-server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
