# Rotate container logs; the default json-file driver never does and can fill the VM disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  code-server:
    build:
      context: .
      args:
        CODE_SERVER_VERSION: ${CODE_SERVER_VERSION:-4.140.0-ls368}
    image: dev-code-server:local
    container_name: code-server
    restart: unless-stopped
    logging: *default-logging
    # Explicit upstream (the libvirt host's dnsmasq): at boot Docker can start the
    # container before dhcpcd writes the VM's /etc/resolv.conf and then has no DNS.
    dns:
      - 192.168.150.1
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ:-Europe/Berlin}
      PASSWORD: ${PASSWORD}
      DEFAULT_WORKSPACE: ${PROJECTS_DIR}
      # Dev apps in the browser without changing project code (see README): code-server
      # proxies {{port}} to a hostname of its own; Node resolves localhost to IPv4 first
      # (Vite would otherwise listen on IPv6 only and the proxy cannot connect); Vite
      # accepts those hostnames.
      PROXY_DOMAIN: ${PROXY_DOMAIN:-}
      NODE_OPTIONS: --dns-result-order=ipv4first
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-}
    group_add:
      - "${DOCKER_GID}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/config
      # Same absolute path inside and outside, so bind mounts in project
      # containers (started via the VM's Docker daemon) resolve correctly.
      - ${PROJECTS_DIR}:${PROJECTS_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.3}
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    logging: *default-logging
    # cloudflared needs no capabilities and no writable filesystem (tested with a
    # real tunnel connection).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    dns:
      - 192.168.150.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      code-server:
        condition: service_healthy
